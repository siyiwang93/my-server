<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      padding: 0 1.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #4f46e5;
      letter-spacing: -0.02em;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      margin-bottom: 2rem;
    }

    .form-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }

    input {
      padding: 0.7rem 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    input.invalid {
      border-color: #ef4444;
    }

    .error {
      font-size: 0.82rem;
      color: #dc2626;
      min-height: 1.2rem;
    }

    .add-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    .add-btn:hover {
      background-color: #4338ca;
      transform: translateY(-1px);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .list-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .count {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .search-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .search-card label {
      display: block;
      margin-bottom: 0.5rem;
    }

    .search-card input {
      width: 100%;
    }

    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #94a3b8;
      font-size: 0.95rem;
      background: #ffffff;
      border: 1px dashed #e2e8f0;
      border-radius: 16px;
    }

    .bookmark-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bookmark-info {
      min-width: 0;
      flex: 1;
    }

    .bookmark-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-url {
      font-size: 0.82rem;
      color: #4f46e5;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      margin-top: 0.15rem;
    }

    .bookmark-url:hover {
      text-decoration: underline;
    }

    .delete-btn {
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background-color: #fef2f2;
      border-color: #fecaca;
      color: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #0f172a; color: #cbd5e1; }
      header { background-color: #1e293b; border-bottom-color: #334155; }
      header h1 { color: #818cf8; }
      .subtitle, .count { color: #94a3b8; }
      .form-card, .bookmark-item, .search-card { background-color: #1e293b; border-color: #334155; }
      .form-card h2, .list-header h2, .bookmark-title { color: #f1f5f9; }
      label { color: #94a3b8; }
      input { background-color: #0f172a; border-color: #475569; color: #f1f5f9; }
      input:focus { border-color: #818cf8; background-color: #1e293b; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15); }
      .bookmark-url { color: #818cf8; }
      .empty-state { background-color: #1e293b; border-color: #334155; color: #64748b; }
      .delete-btn { background-color: #1e293b; border-color: #475569; color: #94a3b8; }
      .delete-btn:hover { background-color: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bookmark Manager</h1>
  </header>

  <main>
    <p class="subtitle">Save your favorite links locally — no account or server required.</p>

    <section class="form-card">
      <h2>Add a bookmark</h2>
      <form id="bookmark-form" novalidate>
        <div class="field">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" placeholder="e.g. GitHub" autocomplete="off">
        </div>
        <div class="field">
          <label for="url-input">URL</label>
          <input type="url" id="url-input" placeholder="https://github.com" autocomplete="off">
        </div>
        <p class="error" id="error-msg" aria-live="polite"></p>
        <button type="submit" class="add-btn">Add Bookmark</button>
      </form>
    </section>

    <div class="list-header">
      <h2>Saved bookmarks</h2>
      <span class="count" id="count"></span>
    </div>

    <div class="search-card">
      <label for="search-input">Search by title</label>
      <input
        type="search"
        id="search-input"
        placeholder="Type to filter bookmarks..."
        autocomplete="off"
      >
    </div>

    <div id="bookmark-list" class="bookmark-list"></div>
  </main>

  <script>
    const STORAGE_KEY = 'bookmarks';
    const form = document.getElementById('bookmark-form');
    const titleInput = document.getElementById('title-input');
    const urlInput = document.getElementById('url-input');
    const errorMsg = document.getElementById('error-msg');
    const listEl = document.getElementById('bookmark-list');
    const countEl = document.getElementById('count');
    const searchInput = document.getElementById('search-input');

    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveBookmarks(bookmarks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isValidUrl(str) {
      try {
        const url = new URL(str);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const bookmarks = getBookmarks();
      const visible = bookmarks
        .map((bookmark, index) => ({ bookmark, index }))
        .filter(({ bookmark }) => !query || bookmark.title.toLowerCase().includes(query));

      if (bookmarks.length === 0) {
        countEl.textContent = '';
        listEl.innerHTML = '<div class="empty-state">No bookmarks yet. Add one above.</div>';
        return;
      }

      if (query) {
        countEl.textContent = `${visible.length} of ${bookmarks.length} shown`;
      } else {
        countEl.textContent = `${bookmarks.length} saved`;
      }

      if (visible.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No bookmarks match your search.</div>';
        return;
      }

      listEl.innerHTML = visible.map(({ bookmark, index }) => `
        <article class="bookmark-item" data-index="${index}">
          <div class="bookmark-info">
            <div class="bookmark-title">${escapeHtml(bookmark.title)}</div>
            <a class="bookmark-url" href="${escapeHtml(bookmark.url)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(bookmark.url)}
            </a>
          </div>
          <button type="button" class="delete-btn" data-index="${index}" aria-label="Delete ${escapeHtml(bookmark.title)}">
            Delete
          </button>
        </article>
      `).join('');
    }

    function showError(message) {
      errorMsg.textContent = message;
      titleInput.classList.toggle('invalid', !titleInput.value.trim());
      urlInput.classList.toggle('invalid', !isValidUrl(urlInput.value.trim()));
    }

    function clearError() {
      errorMsg.textContent = '';
      titleInput.classList.remove('invalid');
      urlInput.classList.remove('invalid');
    }

    function addBookmark(event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      const url = urlInput.value.trim();

      if (!title && !isValidUrl(url)) {
        showError('Please enter a title and a valid URL.');
        return;
      }

      if (!title) {
        showError('Please enter a title.');
        return;
      }

      if (!isValidUrl(url)) {
        showError('Please enter a valid URL (starting with http:// or https://).');
        return;
      }

      clearError();

      const bookmarks = getBookmarks();
      bookmarks.unshift({ title, url });
      saveBookmarks(bookmarks);

      titleInput.value = '';
      urlInput.value = '';
      titleInput.focus();

      render();
    }

    function deleteBookmark(index) {
      const bookmarks = getBookmarks();
      bookmarks.splice(index, 1);
      saveBookmarks(bookmarks);
      render();
    }

    form.addEventListener('submit', addBookmark);

    listEl.addEventListener('click', (event) => {
      const button = event.target.closest('.delete-btn');
      if (!button) return;
      deleteBookmark(Number(button.dataset.index));
    });

    [titleInput, urlInput].forEach((input) => {
      input.addEventListener('input', clearError);
    });

    searchInput.addEventListener('input', render);

    render();
  </script>

</body>
</html>
